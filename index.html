<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ICAT科研前沿雷达：聚合热点、AI应用、科研提效工具、重大科技突破及Nature相关最新研究。"
    >

    <title>
        ICAT · 科研前沿雷达
    </title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


<!-- =====================================================
     顶部
===================================================== -->

<header class="header">

    <div class="header-inner">

        <div class="site-label">
            ICAT · Research Radar
        </div>

        <h1>
            科研前沿雷达
        </h1>

        <p class="subtitle">
            热点 · 新工具 · 新发现 · 新数据 · 新突破
        </p>

        <div
            id="update-time"
            class="update-time"
        >
            正在读取最近更新时间……
        </div>

    </div>

</header>



<!-- =====================================================
     主体
===================================================== -->

<main class="container">


    <!-- =================================================
         今日提示
    ================================================== -->

    <section class="intro">

        <h2>
            今日提示
        </h2>

        <p id="today-summary">
            正在读取最新科研动态……
        </p>

    </section>



    <!-- =================================================
         顶部导航
    ================================================== -->

    <nav
        class="filters"
        aria-label="资讯分类"
    >


        <!-- 全部 -->

        <button
            type="button"
            class="filter active"
            data-filter-type="all"
            data-filter-value="all"
        >
            全部
        </button>


        <!-- 热点 -->

        <button
            type="button"
            class="filter hotspot-filter"
            data-filter-type="hotspot"
            data-filter-value="hotspot"
        >
            热点
        </button>


        <!-- AI变现 -->

        <button
            type="button"
            class="filter"
            data-filter-type="category"
            data-filter-value="AI变现"
        >
            AI变现
        </button>


        <!-- 提效工具 -->

        <button
            type="button"
            class="filter"
            data-filter-type="category"
            data-filter-value="提效工具"
        >
            提效工具
        </button>


        <!-- 前沿动态 -->

        <button
            type="button"
            class="filter"
            data-filter-type="category"
            data-filter-value="前沿动态"
        >
            前沿动态
        </button>


        <!-- Scientific Data -->

        <button
            type="button"
            class="filter journal-filter"
            data-filter-type="source"
            data-filter-value="Scientific Data"
        >
            Scientific Data
        </button>


        <!-- Nature Cities -->

        <button
            type="button"
            class="filter journal-filter"
            data-filter-type="source"
            data-filter-value="Nature Cities"
        >
            Nature Cities
        </button>


    </nav>



    <!-- =================================================
         热点模块
         
         默认隐藏。
         点击“热点”后由 app.js 显示。
    ================================================== -->

    <section
        id="hotspot-section"
        class="hotspot-section"
        hidden
    >

        <div class="section-heading hotspot-heading">

            <div>

                <h2 class="section-title">
                    🔥 热点
                </h2>

                <p class="section-description">
                    从公众热点中寻找值得用 Nature 研究解读的内容方向
                </p>

            </div>


            <span
                id="hotspot-count"
                class="result-count"
            >
            </span>

        </div>


        <div
            id="hotspot-list"
            class="hotspot-list"
        >

            <div class="empty">
                正在读取热点……
            </div>

        </div>

    </section>



    <!-- =================================================
         最新突破
         
         只在“全部”和“前沿动态”显示
    ================================================== -->

    <section
        id="featured-section"
        class="featured-section"
    >

        <div class="section-heading">

            <h2 class="section-title">
                🔥 最新突破
            </h2>

            <span
                id="featured-count"
                class="result-count"
            >
            </span>

        </div>


        <div
            id="featured-list"
            class="featured-grid"
        >
        </div>

    </section>



    <!-- =================================================
         普通资讯
    ================================================== -->

    <section
        id="news-section"
        class="news-section"
    >

        <div class="section-heading">

            <h2
                id="list-title"
                class="section-title"
            >
                最新资讯
            </h2>

            <span
                id="result-count"
                class="result-count"
            >
            </span>

        </div>


        <div
            id="news-list"
            class="news-grid"
        >

            <div class="empty full-grid">

                正在读取最新资讯……

            </div>

        </div>

    </section>


</main>



<!-- =====================================================
     页脚
===================================================== -->

<footer class="footer">

    <strong>
        ICAT · 科研前沿雷达
    </strong>

    <p>
        发现值得关注的热点、新工具、新数据与科研突破
    </p>

</footer>



<!-- =====================================================
     JavaScript
===================================================== -->

<script src="./app.js"></script>


</body>

</html>
